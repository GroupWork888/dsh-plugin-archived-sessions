# Bundle self-activation patch: when this package is installed into a profile
# via `dsh plugin --profile web add dsh-plugin-archived-sessions` (or a local
# checkout / git URL), this patch mounts the plugin's node half. The client
# half — the "Archived" sidebar footer panel, which is the entire feature — is
# discovered automatically from the `dsh.client` declaration in package.json.
#
# The node half is deliberately inert: the browser reads the archive set the
# Host already publishes and fetches archived logs through `session.history`.
# It never opens a session as current, registers no Host services, and writes nothing.
- insert:
    - id: archived-sessions
      name: dsh-plugin-archived-sessions
